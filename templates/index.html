<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8760 Average Temperature</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0a0f1a;--surface:#111827;--surface2:#1a2236;--border:#1e2a42;--text:#e2e8f0;--muted:#7a8ba8;--dim:#4a5568;--solar:#f59e0b;--gas:#3b82f6;--bess:#06b6d4;--grid:#a78bfa;--accent:#10b981;--danger:#ef4444}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  input[type=text],input[type=number],input[type=email]{padding:8px 10px;font-size:13px;font-weight:500;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);outline:none;font-family:'JetBrains Mono',monospace;width:100%}
  input:focus{border-color:var(--accent)}
  .mono{font-family:'JetBrains Mono',monospace}
  .card{background:var(--surface);border-radius:10px;padding:18px;border:1px solid var(--border)}
  .section-hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .section-hdr .title{font-size:12px;font-weight:700;letter-spacing:.5px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;font-weight:600}
  .hint{font-size:10px;color:var(--dim);margin-top:5px;line-height:1.4}
  .btn{padding:10px 22px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:700;transition:all .15s;text-decoration:none;display:inline-block;text-align:center}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .badge{display:inline-block;font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 7px;border-radius:3px}
  .metric-card{background:var(--surface2);border-radius:8px;padding:12px 14px;border:1px solid var(--border)}
  .metric-card .label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
  .metric-card .value{font-size:18px;font-weight:800;font-family:'JetBrains Mono',monospace}
  .metric-card .sub{font-size:9px;color:var(--dim);margin-top:2px}
  .progress-bar{height:7px;background:var(--border);border-radius:4px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--bess));border-radius:4px;transition:width .3s}
  table{width:100%;border-collapse:collapse}
  th{padding:6px 8px;text-align:right;color:var(--muted);font-weight:600;font-size:9px;letter-spacing:.5px;text-transform:uppercase;border-bottom:2px solid var(--border)}
  td{padding:5px 8px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:11px;border-bottom:1px solid rgba(30,42,66,.12)}
  tr:nth-child(even) td{background:rgba(26,34,54,.4)}
  .sep-row td{color:var(--dim) !important;text-align:center !important;font-weight:700;letter-spacing:2px;background:transparent !important}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  @media (max-width: 900px){
    .layout{grid-template-columns:1fr !important}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef} = React;
const C = {accent:'#10b981', solar:'#f59e0b', bess:'#06b6d4', grid:'#a78bfa', danger:'#ef4444', muted:'#7a8ba8', text:'#e2e8f0'};

function App(){
  const [coords, setCoords]   = useState('39.613744, -85.659600');
  const [parsed, setParsed]   = useState(null);
  const [parseErr, setParseErr] = useState(null);
  const [lookingUp, setLookingUp] = useState(false);
  const [endYear, setEndYear] = useState(2024);
  const [nYears, setNYears]   = useState(10);
  const [running, setRunning] = useState(false);
  const [progress, setProgress] = useState({current:0, total:0, status:'idle', message:''});
  const [done, setDone] = useState(null);
  const pollRef = useRef(null);

  // Live-parse / geocode as user types (debounced)
  useEffect(() => {
    const t = setTimeout(() => {
      if (!coords.trim()) { setParsed(null); setParseErr(null); return; }
      setLookingUp(true);
      fetch('/api/parse_coords', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text: coords}),
      })
        .then(r => r.json())
        .then(d => {
          if (d.error) { setParseErr(d.error); setParsed(null); }
          else { setParsed(d); setParseErr(null); }
        })
        .catch(() => {})
        .finally(() => setLookingUp(false));
    }, 500);
    return () => clearTimeout(t);
  }, [coords]);

  const run = () => {
    setRunning(true);
    setDone(null);
    fetch('/api/run', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({coords, end_year: endYear, n_years: nYears}),
    })
      .then(r => r.json())
      .then(d => {
        if (d.error) { alert(d.error); setRunning(false); return; }
        if (pollRef.current) clearInterval(pollRef.current);
        pollRef.current = setInterval(() => {
          fetch('/api/progress').then(r => r.json()).then(p => {
            setProgress(p);
            if (p.status === 'done')  { clearInterval(pollRef.current); setRunning(false); setDone(p); }
            else if (p.status === 'error') { clearInterval(pollRef.current); setRunning(false); alert(p.error || 'Error'); }
          });
        }, 400);
      })
      .catch(e => { setRunning(false); alert(e.message); });
  };

  const yearsLabel = (nYears > 0 && endYear)
    ? `${endYear - nYears + 1}–${endYear}` : '';

  return (<div>
    {/* Header — same pattern as the dispatch app */}
    <div style={{background:'var(--surface)', borderBottom:'1px solid var(--border)', padding:'14px 20px'}}>
      <div style={{display:'flex', alignItems:'center', gap:10}}>
        <img src="/logo.png"  alt="Logo" style={{height:56,  borderRadius:6}} onError={e => {e.target.style.display='none'}} />
        <img src="/logo2.png" alt="Logo" style={{height:128, borderRadius:6}} onError={e => {e.target.style.display='none'}} />
        <div>
          <h1 style={{fontSize:17, fontWeight:800, letterSpacing:-.5}}>8760 Average Temperature</h1>
          <p  style={{fontSize:10, color:'var(--muted)'}}>NREL NSRDB · Hourly air temperature averaged across years · °C and °F</p>
        </div>
      </div>
    </div>

    <div className="layout" style={{padding:'20px', display:'grid', gridTemplateColumns:'minmax(380px, 520px) 1fr', gap:16, alignItems:'start'}}>

      {/* ── INPUT CARD ───────────────────────────────────────── */}
      <div className="card">
        <div className="section-hdr">
          <span style={{fontSize:15}}>📍</span>
          <span className="title">LOCATION & RANGE</span>
        </div>

        <div className="field">
          <label>Location</label>
          <input
            type="text"
            value={coords}
            onChange={e => setCoords(e.target.value)}
            placeholder="City name or coordinates"
          />
          <div className="hint">
            {lookingUp && <span style={{color:C.muted}}>⏳ Looking up…</span>}
            {!lookingUp && parseErr && <span style={{color:C.danger}}>✗ {parseErr}</span>}
            {!lookingUp && parsed && !parseErr && (
              <span style={{color:C.accent}}>
                {parsed.display_name
                  ? <>✓ <span style={{color:C.text}}>{parsed.display_name}</span> · <span className="mono">{parsed.lat.toFixed(4)}, {parsed.lon.toFixed(4)}</span></>
                  : <>✓ lat <span className="mono">{parsed.lat.toFixed(6)}</span>, lon <span className="mono">{parsed.lon.toFixed(6)}</span></>
                }
              </span>
            )}
            {!lookingUp && !parseErr && !parsed && (
              <span>City (e.g. <span className="mono">Indianapolis, IN</span>) or coordinates — decimal or DMS</span>
            )}
          </div>
        </div>

        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
          <div className="field" style={{marginBottom:0}}>
            <label>End Year</label>
            <input type="number" value={endYear} min="1998" max="2024"
                   onChange={e => setEndYear(parseInt(e.target.value) || 2024)} />
          </div>
          <div className="field" style={{marginBottom:0}}>
            <label># Years</label>
            <input type="number" value={nYears} min="1" max="27"
                   onChange={e => setNYears(parseInt(e.target.value) || 10)} />
          </div>
        </div>
        <div className="hint" style={{marginBottom:16}}>
          {yearsLabel
            ? <>Will pull <span className="mono" style={{color:C.accent}}>{yearsLabel}</span> ({nYears} year{nYears===1?'':'s'}) and average each hour-of-year</>
            : <span>Set end year and how many prior years to average</span>}
        </div>

        <button
          className="btn"
          onClick={run}
          disabled={running || !parsed}
          style={{
            background: running || !parsed ? 'var(--border)' : C.accent,
            color: running || !parsed ? 'var(--muted)' : 'var(--bg)',
            width:'100%',
          }}
        >
          {running ? '⏳ Fetching…' : '▶ Pull Data'}
        </button>

        {running && (
          <div style={{marginTop:14}}>
            <div style={{display:'flex', justifyContent:'space-between', marginBottom:4}}>
              <span style={{fontSize:10, color:'var(--muted)', animation:'pulse 1.5s infinite'}}>
                {progress.message || progress.status}
              </span>
              <span className="mono" style={{fontSize:10, color:C.accent}}>
                {progress.current}/{progress.total}
              </span>
            </div>
            <div className="progress-bar">
              <div className="progress-fill" style={{width:`${progress.total > 0 ? progress.current/progress.total*100 : 0}%`}} />
            </div>
          </div>
        )}

        <div className="hint" style={{marginTop:16, paddingTop:14, borderTop:'1px solid var(--border)'}}>
          <strong style={{color:'var(--muted)'}}>Output:</strong> CSV with 8760 rows (hour_of_year, month, day, hour, avg °C, avg °F), rounded to nearest integer.
          NREL rate-limits CSV pulls to 1/sec, so 10 years ≈ 15&nbsp;s.
        </div>
      </div>

      {/* ── RESULT CARD ──────────────────────────────────────── */}
      <div className="card">
        <div className="section-hdr">
          <span style={{fontSize:15}}>🌡️</span>
          <span className="title">RESULT</span>
          {done && (
            <span className="badge"
                  style={{marginLeft:'auto', color:C.accent, background:C.accent+'18', border:`1px solid ${C.accent}33`}}>
              READY
            </span>
          )}
        </div>

        {!done && !running && (
          <div style={{textAlign:'center', padding:'50px 20px', color:'var(--muted)'}}>
            <div style={{fontSize:36, marginBottom:14}}>📊</div>
            <div style={{fontSize:13, fontWeight:600, marginBottom:6}}>No results yet</div>
            <div style={{fontSize:11}}>Enter coordinates and press <strong style={{color:C.accent}}>▶ Pull Data</strong></div>
          </div>
        )}

        {running && !done && (
          <div style={{textAlign:'center', padding:'50px 20px', color:'var(--muted)'}}>
            <div style={{fontSize:36, marginBottom:14, animation:'pulse 1.5s infinite'}}>⏳</div>
            <div style={{fontSize:13, fontWeight:600, marginBottom:6}}>{progress.message}</div>
            <div style={{fontSize:11}}>{progress.current} of {progress.total} years fetched</div>
          </div>
        )}

        {done && (
          <div>
            <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(140px, 1fr))', gap:10, marginBottom:14}}>
              <div className="metric-card">
                <div className="label">Location</div>
                <div className="value" style={{fontSize:14, lineHeight:1.3}}>{done.lat?.toFixed(4)}, {done.lon?.toFixed(4)}</div>
                {parsed?.display_name && (
                  <div className="sub" style={{whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}} title={parsed.display_name}>
                    {parsed.display_name}
                  </div>
                )}
              </div>
              <div className="metric-card">
                <div className="label">Years</div>
                <div className="value" style={{color:C.accent}}>
                  {done.years?.length}
                  <span style={{fontSize:10, color:'var(--dim)', marginLeft:6}}>
                    ({Math.min(...done.years)}–{Math.max(...done.years)})
                  </span>
                </div>
              </div>
              <div className="metric-card">
                <div className="label">Rows</div>
                <div className="value">8,760</div>
              </div>
            </div>

            <a
              href={`/api/download/${done.filename}`}
              className="btn"
              style={{background:C.accent, color:'var(--bg)', marginBottom:10}}
            >
              ⬇ Download CSV
            </a>
            <div className="hint mono" style={{marginBottom:14, color:'var(--muted)'}}>{done.filename}</div>

            {done.head && done.tail && (
              <div style={{overflowX:'auto'}}>
                <div style={{fontSize:10, color:'var(--muted)', textTransform:'uppercase', letterSpacing:1, marginBottom:6, fontWeight:600}}>
                  Preview (first 5 & last 5 hours)
                </div>
                <table>
                  <thead>
                    <tr>
                      <th style={{textAlign:'left'}}>HOY</th>
                      <th>Mo</th><th>Day</th><th>Hr</th>
                      <th>Temp °C</th><th>Temp °F</th>
                    </tr>
                  </thead>
                  <tbody>
                    {done.head.map((p, i) => (
                      <tr key={'h'+i}>
                        <td style={{textAlign:'left', color:'var(--muted)'}}>{p.hour_of_year}</td>
                        <td>{p.month}</td>
                        <td>{p.day}</td>
                        <td>{p.hour}</td>
                        <td style={{color:C.accent, fontWeight:700}}>{p.avg_temp_C}</td>
                        <td style={{color:C.solar, fontWeight:700}}>{p.avg_temp_F}</td>
                      </tr>
                    ))}
                    <tr className="sep-row"><td colSpan="6">⋯</td></tr>
                    {done.tail.map((p, i) => (
                      <tr key={'t'+i}>
                        <td style={{textAlign:'left', color:'var(--muted)'}}>{p.hour_of_year}</td>
                        <td>{p.month}</td>
                        <td>{p.day}</td>
                        <td>{p.hour}</td>
                        <td style={{color:C.accent, fontWeight:700}}>{p.avg_temp_C}</td>
                        <td style={{color:C.solar, fontWeight:700}}>{p.avg_temp_F}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  </div>);
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
